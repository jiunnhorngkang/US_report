<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>軟組織超音波報告</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#667085; --line:#e3e6ec;
  --accent:#1f6feb; --accent-soft:#e8f0fe; --abn:#c2410c; --abn-soft:#fff3eb; --ok:#15803d;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12151b; --panel:#1b2029; --text:#e6e9ef; --muted:#98a2b3; --line:#2c3340;
    --accent:#5b9bff; --accent-soft:#1d2a40; --abn:#fb923c; --abn-soft:#33241a; --ok:#4ade80;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 12px 0 0}
label.inline{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
textarea{width:100%;min-height:54px;resize:vertical}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#dc2626}
.spacer{flex:1}
main{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
@media (max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
#patientList{list-style:none;margin:8px 0 0;padding:0}
#patientList li{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
#patientList li:hover{background:var(--bg)}
#patientList li.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
#patientList .tag{font-size:12px;color:var(--muted);font-weight:400}
.addrow{display:flex;gap:6px}
.addrow input{flex:1;min-width:0}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:15px;margin:0}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.part{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.part b{display:block;margin-bottom:4px}
.part label{margin-right:10px;cursor:pointer}
.exam{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.exam>.head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--accent-soft)}
.exam>.body{padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.struct{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.struct.abn{border-color:var(--abn);background:var(--abn-soft)}
.struct .sname{font-weight:600;margin-bottom:4px}
.struct .sname small{color:var(--muted);font-weight:400}
.find{display:flex;align-items:center;gap:6px;padding:2px 0;flex-wrap:wrap}
.find label{cursor:pointer}
.find input[type=number]{width:72px;padding:2px 6px}
.find .unit{color:var(--muted);font-size:13px}
.exam .other{grid-column:1/-1}
.muted{color:var(--muted)}
pre.report{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;font:14px/1.6 "Noto Sans TC","Microsoft JhengHei",ui-monospace,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);width:min(900px,94vw);max-height:90vh;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.9}
@media print{
  header,aside,#editor,.noprint{display:none!important}
  body{background:#fff;color:#000}
  dialog{position:static;border:none;width:auto;max-height:none}
  pre.report{border:none;background:#fff}
}
</style>
</head>
<body>
<header>
  <h1>軟組織超音波報告</h1>
  <label class="inline">檢查日期 <input type="date" id="date"></label>
  <label class="inline">報告語言
    <select id="lang"><option value="en" selected>English</option><option value="zh">中文</option></select>
  </label>
  <span class="spacer"></span>
  <button class="primary" id="btnOutput">輸出當日所有報告</button>
  <button id="btnExport" title="備份當日資料 (JSON)">匯出備份</button>
  <button id="btnImport" title="從 JSON 匯入">匯入</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</header>

<main>
  <aside class="card">
    <h2>當日病患流水號</h2>
    <div class="addrow">
      <input type="text" id="newSerial" placeholder="例如 001" autocomplete="off">
      <button class="primary" id="btnAdd">新增</button>
    </div>
    <ul id="patientList"></ul>
    <p class="muted" id="emptyHint" style="font-size:13px">尚無病患。輸入流水號後按「新增」。</p>
  </aside>

  <section id="editor" class="card">
    <p class="muted">請先於左側新增或選擇流水號。</p>
  </section>
</main>

<dialog id="outDlg">
  <div class="row noprint" style="margin-top:0">
    <h2 style="margin:0">當日報告（依流水號排序）</h2>
    <span class="spacer"></span>
    <button class="primary" id="btnCopyAll">複製全部</button>
    <button id="btnDownload">下載 .txt</button>
    <button id="btnPrint">列印</button>
    <button id="btnClose">關閉</button>
  </div>
  <pre class="report" id="outText"></pre>
</dialog>

<div class="toast" id="toast"></div>

<script>
// ---------- 部位 / 結構 / 常見發現 ----------
// 每個發現: [id, 中文, English, 單位(選填)]
const T = (id, zh, en, unit) => ({id, zh, en, unit});
const TDP  = T('tdp','肌腱病變（增厚、低回音）','tendinopathy (thickening with hypoechogenicity)');
const PT   = T('ptear','部分撕裂','partial tear','mm');
const RUP  = T('rup','完全斷裂','complete rupture','mm');
const DOP  = T('dop','都卜勒血流增加','increased Doppler vascularity');
const THK  = T('thick','增厚（慢性扭傷變化）','thickening (chronic sprain change)');
const LTEAR= T('tear','撕裂','tear');
const BUR  = T('bur','滑囊炎／積液','bursitis with fluid distension','mm');

const PARTS = [
 {key:'shoulder', zh:'肩', en:'shoulder', structs:[
  {id:'lhbt', zh:'二頭肌長頭肌腱', en:'Long head of biceps tendon', f:[
    T('eff','腱鞘積液','tendon sheath effusion'), TDP, PT, RUP,
    T('sublux','半脫位／脫位','subluxation / dislocation')]},
  {id:'ssp', zh:'棘上肌腱', en:'Supraspinatus tendon', f:[
    TDP, T('calc','鈣化性肌腱炎','calcific tendinitis','mm'),
    T('ptb','部分厚度撕裂（滑囊側）','partial-thickness tear, bursal side','mm'),
    T('pta','部分厚度撕裂（關節側）','partial-thickness tear, articular side','mm'),
    T('pti','肌腱內撕裂','intrasubstance tear','mm'),
    T('ft','全層撕裂','full-thickness tear','mm')]},
  {id:'isp', zh:'棘下肌腱', en:'Infraspinatus tendon', f:[TDP, T('calc','鈣化','calcification','mm'), PT, T('ft','全層撕裂','full-thickness tear','mm')]},
  {id:'ssc', zh:'肩胛下肌腱', en:'Subscapularis tendon', f:[TDP, T('calc','鈣化','calcification','mm'), PT, T('ft','全層撕裂','full-thickness tear','mm')]},
  {id:'sasd', zh:'肩峰下－三角肌下滑囊', en:'Subacromial-subdeltoid bursa', f:[
    BUR, T('thick','滑囊增厚','bursal thickening','mm')]},
  {id:'dyn', zh:'動態檢查', en:'Dynamic assessment', f:[
    T('imp','肩峰下夾擊（外展時滑囊堆積）','subacromial impingement (bursal bunching on abduction)')]},
  {id:'acj', zh:'肩鎖關節', en:'Acromioclavicular joint', f:[
    T('oa','退化性變化（骨刺、關節囊膨出）','degenerative change (osteophytes, capsular distension)'),
    T('eff','關節積液','joint effusion')]},
  {id:'ghj', zh:'盂肱關節', en:'Glenohumeral joint', f:[
    T('eff','後隱窩積液','posterior recess effusion'),
    T('chl','喙肱韌帶增厚（疑沾黏性關節囊炎）','thickened coracohumeral ligament, suggestive of adhesive capsulitis','mm')]},
 ]},
 {key:'elbow', zh:'肘', en:'elbow', structs:[
  {id:'cet', zh:'總伸肌腱起點', en:'Common extensor tendon origin', f:[
    T('tdp','肌腱病變（外上髁炎）','tendinopathy (lateral epicondylitis)'), PT,
    T('calc','鈣化／附著點骨刺','calcification / enthesophyte'), DOP]},
  {id:'cft', zh:'總屈肌腱起點', en:'Common flexor tendon origin', f:[
    T('tdp','肌腱病變（內上髁炎）','tendinopathy (medial epicondylitis)'), PT,
    T('calc','鈣化／附著點骨刺','calcification / enthesophyte'), DOP]},
  {id:'dbt', zh:'遠端二頭肌腱', en:'Distal biceps tendon', f:[
    TDP, PT, RUP, T('bur','二頭肌橈骨滑囊炎','bicipitoradial bursitis')]},
  {id:'tri', zh:'三頭肌腱', en:'Triceps tendon', f:[TDP, PT, T('enth','附著點骨刺','insertional enthesophyte')]},
  {id:'olec', zh:'鷹嘴滑囊', en:'Olecranon bursa', f:[BUR]},
  {id:'ucl', zh:'尺側副韌帶', en:'Ulnar collateral ligament', f:[THK, LTEAR]},
  {id:'rcl', zh:'橈側副韌帶複合體', en:'Radial collateral ligament complex', f:[THK, LTEAR]},
  {id:'jt', zh:'肘關節', en:'Elbow joint', f:[
    T('eff','關節積液','joint effusion'), T('syn','滑膜增生','synovial proliferation'),
    T('lb','關節內游離體','intra-articular loose body')]},
  {id:'un', zh:'尺神經（肘隧道）', en:'Ulnar nerve (cubital tunnel)', f:[
    T('swell','神經腫脹（截面積增加）','nerve swelling (increased cross-sectional area)','mm²'),
    T('sublux','屈肘時半脫位','subluxation on elbow flexion')]},
 ]},
 {key:'knee', zh:'膝', en:'knee', structs:[
  {id:'qt', zh:'股四頭肌腱', en:'Quadriceps tendon', f:[TDP, PT, RUP]},
  {id:'pt', zh:'髕骨肌腱', en:'Patellar tendon', f:[
    T('tdp','肌腱病變（跳躍膝）','tendinopathy (jumper\'s knee)'), PT,
    T('osd','脛骨粗隆骨突炎（Osgood-Schlatter）','Osgood-Schlatter disease'), DOP]},
  {id:'spr', zh:'髕上囊', en:'Suprapatellar recess', f:[
    T('eff','關節積液','joint effusion','mm'), T('syn','滑膜增生','synovial proliferation','mm')]},
  {id:'ppb', zh:'髕周滑囊', en:'Peripatellar bursae', f:[
    T('prep','髕前滑囊炎','prepatellar bursitis'), T('dinf','髕下深層滑囊炎','deep infrapatellar bursitis')]},
  {id:'mcl', zh:'內側副韌帶', en:'Medial collateral ligament', f:[THK, LTEAR,
    T('ps','Pellegrini-Stieda 鈣化','Pellegrini-Stieda calcification')]},
  {id:'lcl', zh:'外側副韌帶', en:'Lateral collateral ligament', f:[THK, LTEAR]},
  {id:'pes', zh:'鵝足', en:'Pes anserinus', f:[T('bur','鵝足滑囊炎','pes anserine bursitis'), TDP]},
  {id:'itb', zh:'髂脛束', en:'Iliotibial band', f:[
    T('fric','遠端增厚／周邊積液（髂脛束摩擦症候群）','distal thickening / adjacent fluid (ITB friction syndrome)')]},
  {id:'men', zh:'半月板', en:'Meniscus', f:[
    T('mext','內側半月板突出','medial meniscal extrusion','mm'),
    T('lext','外側半月板突出','lateral meniscal extrusion','mm'),
    T('cyst','半月板旁囊腫','parameniscal cyst','mm')]},
  {id:'cart', zh:'股骨滑車軟骨', en:'Femoral trochlear cartilage', f:[
    T('thin','軟骨變薄','cartilage thinning','mm'), T('irr','軟骨表面不規則','irregular cartilage surface')]},
  {id:'osteo', zh:'關節邊緣', en:'Joint margins', f:[T('osteo','骨刺形成（退化性關節炎）','osteophyte formation (degenerative arthritis)')]},
  {id:'pop', zh:'膕窩', en:'Popliteal fossa', f:[
    T('baker','貝克氏囊腫','Baker\'s cyst','mm'), T('rbaker','貝克氏囊腫破裂','ruptured Baker\'s cyst')]},
 ]},
 {key:'ankle', zh:'踝', en:'ankle', structs:[
  {id:'at', zh:'阿基里斯腱', en:'Achilles tendon', f:[
    T('tdp','肌腱病變（增厚、低回音）','tendinopathy (thickening with hypoechogenicity)','mm'), PT,
    T('rup','完全斷裂','complete rupture, gap','mm'),
    T('ins','附著點病變／鈣化','insertional enthesopathy / calcification'), DOP]},
  {id:'rcb', zh:'跟骨後滑囊', en:'Retrocalcaneal bursa', f:[BUR]},
  {id:'atfl', zh:'前距腓韌帶', en:'Anterior talofibular ligament', f:[THK,
    T('ptear','部分撕裂','partial tear'), T('ftear','完全撕裂','complete tear')]},
  {id:'cfl', zh:'跟腓韌帶', en:'Calcaneofibular ligament', f:[THK,
    T('ptear','部分撕裂','partial tear'), T('ftear','完全撕裂','complete tear')]},
  {id:'aitfl', zh:'前下脛腓韌帶', en:'Anterior inferior tibiofibular ligament', f:[THK, LTEAR]},
  {id:'delt', zh:'三角韌帶', en:'Deltoid ligament', f:[THK, LTEAR]},
  {id:'per', zh:'腓骨肌腱', en:'Peroneal tendons', f:[
    T('teno','腱鞘炎','tenosynovitis'), T('split','縱向撕裂','longitudinal split tear'),
    T('sublux','半脫位','subluxation')]},
  {id:'ptt', zh:'脛後肌腱', en:'Tibialis posterior tendon', f:[T('teno','腱鞘炎','tenosynovitis'), TDP, PT]},
  {id:'tat', zh:'脛前肌腱', en:'Tibialis anterior tendon', f:[TDP, PT]},
  {id:'pf', zh:'足底筋膜', en:'Plantar fascia', f:[
    T('thick','增厚、低回音（足底筋膜炎）','thickened and hypoechoic (plantar fasciitis)','mm'),
    T('ptear','部分撕裂','partial tear'), T('spur','跟骨骨刺','calcaneal spur')]},
  {id:'tt', zh:'脛距關節', en:'Tibiotalar joint', f:[
    T('eff','前隱窩積液','anterior recess effusion','mm'),
    T('syn','滑膜增生（前外側夾擊）','synovial proliferation (anterolateral impingement)')]},
  {id:'tarsal', zh:'跗骨隧道', en:'Tarsal tunnel', f:[
    T('gang','腱鞘囊腫','ganglion cyst','mm'), T('tn','脛神經腫脹','tibial nerve swelling')]},
 ]},
];
const SIDES = [{k:'R', zh:'右', en:'Right'}, {k:'L', zh:'左', en:'Left'}];
const partByKey = Object.fromEntries(PARTS.map(p => [p.key, p]));

// ---------- 儲存（僅存於本機瀏覽器） ----------
const STORE_KEY = 'usreport.v1';
let db = {};
try { db = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch { db = {}; }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch {} }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const natCmp = (a,b) => a.localeCompare(b, undefined, {numeric:true});

let curDate = today(), curSerial = null;
const day = () => (db[curDate] ||= {});
const lang = () => $('#lang').value;

// ---------- 病患清單 ----------
function renderList(){
  const d = db[curDate] || {};
  const serials = Object.keys(d).sort(natCmp);
  $('#emptyHint').style.display = serials.length ? 'none' : '';
  $('#patientList').innerHTML = serials.map(s => {
    const exams = Object.keys(d[s].exams || {}).map(examLabelZh).join('、');
    return `<li data-s="${esc(s)}" class="${s===curSerial?'active':''}">
      <span>${esc(s)}</span><span class="tag">${esc(exams || '未選部位')}</span></li>`;
  }).join('');
}
function examLabelZh(ek){ const [p,s] = ek.split('-'); return SIDES.find(x=>x.k===s).zh + partByKey[p].zh; }

function addPatient(){
  const s = $('#newSerial').value.trim();
  if (!s) return;
  if (!day()[s]) day()[s] = {exams:{}, note:''};
  save(); $('#newSerial').value = '';
  select(s);
}
function select(s){ curSerial = s; renderList(); renderEditor(); }

// ---------- 編輯區 ----------
function renderEditor(){
  const ed = $('#editor');
  const p = curSerial && (db[curDate]||{})[curSerial];
  if (!p){ ed.innerHTML = '<p class="muted">請先於左側新增或選擇流水號。</p>'; return; }

  let h = `<div class="row" style="margin-top:0">
      <h2 style="margin:0">流水號 ${esc(curSerial)}</h2><span class="spacer"></span>
      <button class="danger" id="btnDel">刪除此病患</button></div>
    <div class="parts">` +
    PARTS.map(pt => `<div class="part"><b>${pt.zh}部 <span class="muted" style="font-weight:400">${pt.en}</span></b>` +
      SIDES.map(sd => { const ek = `${pt.key}-${sd.k}`;
        return `<label><input type="checkbox" data-exam="${ek}" ${p.exams[ek]?'checked':''}> ${sd.zh}</label>`; }).join('') +
      `</div>`).join('') + `</div>`;

  for (const ek of orderedExams(p)){
    const [pk, sk] = ek.split('-'); const pt = partByKey[pk]; const ex = p.exams[ek];
    h += `<div class="exam"><div class="head"><h3>${SIDES.find(x=>x.k===sk).zh}${pt.zh} <span class="muted" style="font-weight:400">${sk==='R'?'Right':'Left'} ${pt.en}</span></h3>
      <button data-clear="${ek}">全部正常（清除勾選）</button></div><div class="body">`;
    for (const st of pt.structs){
      const abn = st.f.some(f => ex.f[`${st.id}.${f.id}`]);
      h += `<div class="struct ${abn?'abn':''}"><div class="sname">${st.zh} <small>${st.en}</small></div>` +
        st.f.map(f => { const fk = `${st.id}.${f.id}`; const on = !!ex.f[fk];
          return `<div class="find"><label><input type="checkbox" data-ek="${ek}" data-f="${fk}" ${on?'checked':''}> ${f.zh}</label>` +
            (f.unit && on ? `<input type="number" step="0.1" min="0" data-ek="${ek}" data-v="${fk}" value="${esc(ex.v[fk]??'')}" placeholder="數值"><span class="unit">${f.unit}</span>` : '') +
            `</div>`; }).join('') + `</div>`;
    }
    h += `<div class="other"><label class="muted">其他發現（自由輸入，會加入報告）</label>
      <textarea data-ek="${ek}" data-other>${esc(ex.other||'')}</textarea></div></div></div>`;
  }

  h += `<div><label class="muted">建議／備註（整份報告）</label><textarea id="note">${esc(p.note||'')}</textarea></div>
    <div class="row"><h2 style="margin:0">報告預覽</h2><span class="spacer"></span><button id="btnCopyOne">複製此份</button></div>
    <pre class="report" id="preview"></pre>`;
  ed.innerHTML = h;
  updatePreview();
}
function orderedExams(p){
  const keys = [];
  for (const pt of PARTS) for (const sd of SIDES){ const ek = `${pt.key}-${sd.k}`; if (p.exams[ek]) keys.push(ek); }
  return keys;
}
function updatePreview(){ const el = $('#preview'); if (el) el.textContent = buildReport(curDate, curSerial, lang()); }

// ---------- 產生報告文字 ----------
function buildReport(date, serial, L){
  const p = db[date][serial]; const zh = L === 'zh';
  const exams = orderedExams(p);
  const sideName = sk => { const s = SIDES.find(x=>x.k===sk); return zh ? s.zh : s.en; };
  const examName = ek => { const [pk,sk] = ek.split('-'); return zh ? sideName(sk)+partByKey[pk].zh : `${sideName(sk)} ${partByKey[pk].en}`; };
  const out = [];
  out.push(zh ? `流水號：${serial}　　檢查日期：${date}` : `No.: ${serial}    Date: ${date}`);
  out.push(zh ? `檢查項目：軟組織超音波${exams.length ? '（' + exams.map(examName).join('、') + '）' : ''}`
              : `Exam: Soft tissue ultrasound${exams.length ? ' (' + exams.map(examName).join(', ') + ')' : ''}`);
  if (!exams.length){ out.push(zh ? '（尚未選擇檢查部位）' : '(No region selected)'); return out.join('\n'); }

  const impressions = [];
  out.push('', zh ? '【檢查所見 Findings】' : 'FINDINGS:');
  for (const ek of exams){
    const [pk] = ek.split('-'); const pt = partByKey[pk]; const ex = p.exams[ek];
    out.push(zh ? `＜${examName(ek)}＞` : `<${examName(ek)}>`);
    const normal = []; const abnImp = [];
    for (const st of pt.structs){
      const fs = st.f.filter(f => ex.f[`${st.id}.${f.id}`]);
      if (!fs.length){ normal.push(zh ? st.zh : st.en); continue; }
      const items = fs.map(f => { const v = ex.v[`${st.id}.${f.id}`];
        const t = zh ? f.zh : f.en; return v ? (zh ? `${t}，約 ${v} ${f.unit}` : `${t}, ${v} ${f.unit}`) : t; });
      out.push(zh ? `- ${st.zh}：${items.join('；')}。` : `- ${st.en}: ${items.join('; ')}.`);
      const lc = /^Achilles/.test(st.en) ? st.en : st.en[0].toLowerCase() + st.en.slice(1);
      abnImp.push(zh ? `${st.zh}${fs.map(f=>f.zh).join('、')}` : `${fs.map(f=>f.en).join(' and ')} of the ${lc}`);
    }
    if (ex.other && ex.other.trim()){
      out.push(zh ? `- 其他：${ex.other.trim()}` : `- Others: ${ex.other.trim()}`);
      abnImp.push(ex.other.trim());
    }
    if (normal.length){
      const all = normal.length === pt.structs.length && !(ex.other && ex.other.trim());
      out.push(zh ? (all ? `- 所檢查結構（${normal.join('、')}）均未見明顯異常。` : `- 其餘結構（${normal.join('、')}）未見明顯異常。`)
                  : (all ? `- The examined structures (${normal.join(', ')}) are unremarkable.` : `- The remaining structures (${normal.join(', ')}) are unremarkable.`));
    }
    impressions.push(abnImp.length ? (zh ? `${examName(ek)}：${abnImp.join('；')}。` : `${examName(ek)}: ${abnImp.join('; ')}.`)
                                   : (zh ? `${examName(ek)}：超音波檢查未見明顯異常。` : `${examName(ek)}: No significant sonographic abnormality.`));
  }
  out.push('', zh ? '【診斷印象 Impression】' : 'IMPRESSION:');
  impressions.forEach((s,i) => out.push(`${i+1}. ${s}`));
  if (p.note && p.note.trim()) out.push('', zh ? '【建議／備註】' : 'COMMENT:', p.note.trim());
  return out.join('\n');
}
function buildAll(){
  const d = db[curDate] || {};
  const sep = '\n' + '='.repeat(40) + '\n';
  return Object.keys(d).sort(natCmp).map(s => buildReport(curDate, s, lang())).join('\n' + sep + '\n');
}

// ---------- 事件 ----------
$('#date').value = curDate;
$('#date').addEventListener('change', e => { curDate = e.target.value || today(); curSerial = null; renderList(); renderEditor(); });
try { const l = localStorage.getItem('usreport.lang'); if (l) $('#lang').value = l; } catch {}
$('#lang').addEventListener('change', () => { try { localStorage.setItem('usreport.lang', lang()); } catch {} updatePreview(); });
$('#btnAdd').addEventListener('click', addPatient);
$('#newSerial').addEventListener('keydown', e => { if (e.key === 'Enter') addPatient(); });
$('#patientList').addEventListener('click', e => { const li = e.target.closest('li'); if (li) select(li.dataset.s); });

const ed = $('#editor');
ed.addEventListener('change', e => {
  const t = e.target; const p = day()[curSerial]; if (!p) return;
  if (t.dataset.exam){
    const ek = t.dataset.exam;
    if (t.checked) p.exams[ek] ||= {f:{}, v:{}, other:''};
    else {
      const ex = p.exams[ek];
      const dirty = ex && (Object.keys(ex.f).length || (ex.other||'').trim());
      if (dirty && !confirm('此部位已有勾選內容，確定移除？')){ t.checked = true; return; }
      delete p.exams[ek];
    }
    save(); renderList(); renderEditor();
  } else if (t.dataset.f){
    const ex = p.exams[t.dataset.ek];
    if (t.checked) ex.f[t.dataset.f] = true; else { delete ex.f[t.dataset.f]; delete ex.v[t.dataset.f]; }
    save(); renderEditor();
  }
});
ed.addEventListener('input', e => {
  const t = e.target; const p = day()[curSerial]; if (!p) return;
  if (t.dataset.v){ const ex = p.exams[t.dataset.ek]; if (t.value) ex.v[t.dataset.v] = t.value; else delete ex.v[t.dataset.v]; }
  else if (t.hasAttribute('data-other')) p.exams[t.dataset.ek].other = t.value;
  else if (t.id === 'note') p.note = t.value;
  else return;
  save(); updatePreview();
});
ed.addEventListener('click', e => {
  const t = e.target; const p = day()[curSerial]; if (!p) return;
  if (t.dataset.clear){ const ex = p.exams[t.dataset.clear]; ex.f = {}; ex.v = {}; ex.other = ''; save(); renderEditor(); }
  else if (t.id === 'btnDel'){
    if (!confirm(`確定刪除流水號 ${curSerial} 的所有資料？`)) return;
    delete day()[curSerial]; curSerial = null; save(); renderList(); renderEditor();
  } else if (t.id === 'btnCopyOne') copy($('#preview').textContent);
});

function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1500); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('已複製');
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('#btnOutput').addEventListener('click', () => {
  const txt = buildAll();
  $('#outText').textContent = txt || '當日尚無資料。';
  $('#outDlg').showModal();
});
$('#btnClose').addEventListener('click', () => $('#outDlg').close());
$('#btnCopyAll').addEventListener('click', () => copy($('#outText').textContent));
$('#btnDownload').addEventListener('click', () => download(`US_report_${curDate}.txt`, '﻿' + $('#outText').textContent, 'text/plain;charset=utf-8'));
$('#btnPrint').addEventListener('click', () => window.print());

$('#btnExport').addEventListener('click', () =>
  download(`US_report_${curDate}.json`, JSON.stringify({date:curDate, data:db[curDate]||{}}, null, 2), 'application/json'));
$('#btnImport').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (!j.date || typeof j.data !== 'object') throw 0;
    if (db[j.date] && Object.keys(db[j.date]).length && !confirm(`${j.date} 已有資料，匯入將合併（同流水號會被覆蓋）。繼續？`)) return;
    db[j.date] = Object.assign(db[j.date] || {}, j.data); save();
    curDate = j.date; $('#date').value = curDate; curSerial = null; renderList(); renderEditor(); toast('匯入完成');
  } catch { alert('檔案格式不正確'); }
});

renderList();
</script>
